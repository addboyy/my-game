<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 위에서 내려다본 바퀴 달린 의자 (위쪽이 앞) -->
  <!-- 다리 5개 -->
  <g stroke="#2b2b2b" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="34" x2="32" y2="4"/>
    <line x1="32" y1="34" x2="4" y2="25"/>
    <line x1="32" y1="34" x2="60" y2="25"/>
    <line x1="32" y1="34" x2="14" y2="60"/>
    <line x1="32" y1="34" x2="50" y2="60"/>
  </g>
  <!-- 바퀴 5개 -->
  <g fill="#111111">
    <circle cx="32" cy="4" r="4"/>
    <circle cx="4" cy="25" r="4"/>
    <circle cx="60" cy="25" r="4"/>
    <circle cx="14" cy="60" r="4"/>
    <circle cx="50" cy="60" r="4"/>
  </g>
  <!-- 앉는 부분 -->
  <rect x="12" y="14" width="40" height="38" rx="9" fill="#c256b0" stroke="#974189" stroke-width="2"/>
  <!-- 등받이 (뒤쪽 = 아래) -->
  <rect x="10" y="46" width="44" height="10" rx="5" fill="#bb55aa"/>
  <!-- 팔걸이 -->
  <rect x="6" y="22" width="6" height="22" rx="3" fill="#2b2b2b"/>
  <rect x="52" y="22" width="6" height="22" rx="3" fill="#2b2b2b"/>
</svg>
